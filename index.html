<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임 공략집 기록 사이트</title>
    <link rel="icon" href="data:,">
    
    <style>
        body { background-color: #3b3b3b; margin: 0; padding: 20px; font-family: sans-serif; }
        #container { background-color: #2b2b2b; width: 1000px; padding: 20px; margin: 0 auto; border: 1px solid white; color: white; }

        /* 1. 헤더 영역 */
        #header { display: flex; justify-content: space-between; align-items: center; border: 1px solid white; padding: 10px; margin-bottom: 20px; }
        .profile-box { display: flex; align-items: center; width: 250px; }
        
        /* [보완됨] 프로필 이미지 틀 고정 */
        .profile-img { 
            width: 70px; height: 70px; min-width: 70px; 
            border-radius: 50%; border: 2px solid white; background-color: white; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; /* 이미지가 삐져나오지 않게 잘라줌 */
        }
        .profile-img img { 
            width: 100%; height: 100%; 
            object-fit: cover; /* 찌그러짐 방지 및 비율 유지 */
        }
        
        .profile-text { margin-left: 15px; }
        .id-box, .rank-box { background-color: white; color: black; width: 120px; height: 25px; margin-bottom: 5px; text-align: center; font-weight: bold; line-height: 25px; }
        
        .interest-box { border: 1px solid white; padding: 10px; width: 400px; text-align: center; }
        .interest-box ul { display: flex; justify-content: center; padding: 0; margin: 0 0 10px 0; list-style: none; }
        
        /* [보완됨] 관심 게임 로고 동그라미 고정 */
        .circle { 
            width: 40px; height: 40px; min-width: 40px; 
            border-radius: 50%; border: 2px solid white; margin: 0 10px; 
            background-color: white; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; 
        }
        .circle a { display: block; width: 100%; height: 100%; }
        .circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .interest-title { font-size: 14px; }
        .login-box { display: flex; flex-direction: column; gap: 5px; }
        .login-box a { display: inline-block; background-color: white; color: black; padding: 5px 15px; text-decoration: none; font-weight: bold; text-align: center; }

        /* 2. 메인 컨텐츠 영역 */
        #main-content { display: flex; }
        #sidebar { width: 250px; border: 1px solid white; padding: 15px; margin-right: 30px; }
        
        /* [보완됨] 사이드바 미니 로고와 텍스트 정렬 */
        .current-game { background-color: white; color: black; padding: 10px; margin-bottom: 20px; text-align: center; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .current-game img { width: 25px; height: 25px; object-fit: cover; border-radius: 50%; }
        
        .btn-write { display: block; background-color: #fdcb6e; color: black; padding: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; cursor: pointer; text-decoration: none; }
        .board-title { text-align: center; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid white; font-weight: bold; }
        .board-list { padding: 0; list-style: none; }
        .board-list li { background-color: white; margin-bottom: 10px; text-align: center; cursor: pointer; color: black; padding: 10px; font-weight: bold;}
        .board-list li:hover { background-color: #dddddd; }

        /* 3. 본문 영역 */
        #content-area { width: 40%; flex-grow: 1; border: 1px solid white; padding: 20px; color: black; }
        #post-view h2, #write-form h2 { background-color: #bbbbbb; padding: 10px; margin-top: 0; text-align: center; }
        
        /* [보완됨] 본문 메인 이미지 상자 고정 */
        .video-box { 
            border: 5px solid #555555; background-color: #dddddd; 
            margin-bottom: 20px; text-align: center; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 250px; /* 사진이 없어도 상자 크기 유지 */
            overflow: hidden;
        }
        .video-box img { max-width: 100%; max-height: 250px; object-fit: contain; } /* 비율 유지하며 꽉 채우기 */
        
        .text-box { background-color: white; padding: 10px; margin-bottom: 10px; min-height: 20px; }

        /* 표(table) 스타일 */
        table { width: 100%; border-collapse: collapse; text-align: center; background-color: white; margin-bottom: 10px; }
        th, td { border: 1px solid black; padding: 8px; }
        th { background-color: #eee; }

        /* 폼 영역 */
        #write-form { display: none; }
        .form-area input, .form-area textarea { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        .form-area textarea { height: 150px; }
        .submit-btn { display: block; background-color: #55efc4; padding: 15px; text-align: center; color: black; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="container">
        
        <!-- 1. 헤더 영역 -->
        <div id="header">
            <div class="profile-box">
                <div class="profile-img">
                    <!-- src 안의 파일명을 본인 컴퓨터에 있는 실제 이미지 이름으로 정확히 바꿔야 합니다 -->
                    <img id="user-img" src="profile.png" alt="프로필">
                </div>
                <div class="profile-text">
                    <div id="user-id" class="id-box">goldring</div>
                    <div id="user-rank" class="rank-box">랭킹 32위</div>
                </div>
            </div>

            <div class="interest-box">
                <ul>
                    <li class="circle"><a href="#"><img src="lol-logo.png" alt="롤 로고"></a></li>
                    <li class="circle"><a href="#"><img src="maple-logo.png" alt="메이플 로고"></a></li>
                    <li class="circle"><a href="#"><img src="val-logo.png" alt="발로란트 로고"></a></li>
                </ul>
                <span class="interest-title">관심 게임 사이트 (클릭시 이동)</span>
            </div>

            <div id="login-buttons" class="login-box">
                <a href="#" onclick="login(); return false;">로그인/회원정보</a>
            </div>
        </div>

        <!-- 2. 메인 컨텐츠 영역 -->
        <div id="main-content">
            
            <!-- 사이드 메뉴 -->
            <div id="sidebar">
                <div class="current-game" onclick="toggleGame()">
                    <img id="game-icon" src="mini-logo.png" alt="미니로고">
                    <span id="game-name">현재 게임: 리그오브레전드</span>
                </div>
                
                <a href="#" class="btn-write" onclick="showWriteForm(); return false;">✍️ 글 작성칸</a>
                
                <div id="board-title" class="board-title">리그오브레전드 공략 목록</div>
                <ul id="board-list" class="board-list">
                    <!-- 자바스크립트가 여기에 목록을 그려줍니다 -->
                </ul>
            </div>

            <!-- 3. 본문 영역 -->
            <div id="content-area">
                
                <!-- 글 보기 화면 -->
                <div id="post-view">
                    <h2 id="post-title">공략을 선택해주세요</h2>
                    <div id="post-media" class="video-box">
                        <img src="main-image.png" alt="메인 이미지">
                    </div>
                    <div id="post-content">
                        <div class="text-box">
                            <p>좌측에서 공략을 선택하거나 새 글을 작성하세요.</p>
                        </div>
                    </div>
                </div>

                <!-- 글 작성 화면 -->
                <div id="write-form">
                    <h2>새 공략 작성하기</h2>
                    <div class="form-area">
                        <input type="text" id="write-title" placeholder="공략 제목 (예: 가렌 템트리)">
                        <input type="text" id="write-media" placeholder="이미지 파일명 (예: garen.png)">
                        <textarea id="write-text" placeholder="내용을 적어주세요."></textarea>
                        <a href="#" class="submit-btn" onclick="submitPost(); return false;">게시판에 등록하기</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- [JavaScript 영역] -->
    <script>
        let currentGame = 'lol'; 

        let posts = {
            'lol': [
                { title: "가렌 초보자 템트리", media: "garen-guide.png", content: "<p>1. 시작은 바텀 듀오의 리쉬를 받는 쪽이 편합니다.</p><br><p>2. 3캠프 후 바위게 싸움이나 갱킹을 판단하세요.</p>" },
                { title: "정글 동선 짜는 법", media: "jungle-guide.png", content: "<p>1. 시작은 바텀 듀오의 리쉬를 받는 쪽이 편합니다.</p><br><p>2. 3캠프 후 바위게 싸움이나 갱킹을 판단하세요.</p><br><p>3. 오브젝트(용/유충) 시야 장악은 필수입니다.</p>" },
                { title: "미드 챔피언 상성표", media: "mid-tier.png", content: "<table><tr><th>내 챔피언</th><th>상대</th><th>유불리</th></tr><tr><td>아리</td><td>제드</td><td>불리</td></tr><tr><td>탈론</td><td>빅토르</td><td>유리</td></tr></table>" }
            ],
            'maple': [
                { title: "200레벨 폭업 사냥터", media: "maple-level.png", content: "<p>190부터는 황혼의 페리온으로 가세요.</p>" },
                { title: "무자본 돈 버는 법", media: "maple-money.png", content: "<p>매일 해야 할 일 순서:</p><ol><li>우르스 3판 돌기</li><li>보스 장신구 팔기</li><li>일일 퀘스트 완료</li></ol>" }
            ]
        };

        function login() {
            let randomRank = Math.floor(Math.random() * 100) + 1; 
            document.getElementById('user-id').innerText = "goldring";
            document.getElementById('user-rank').innerText = "랭킹 " + randomRank + "위";
            alert("환영합니다, goldring님!");
        }

        function toggleGame() {
            currentGame = (currentGame === 'lol') ? 'maple' : 'lol';
            let gameNameText = currentGame === 'lol' ? "리그오브레전드" : "메이플스토리";
            
            document.getElementById('game-name').innerText = "현재 게임: " + gameNameText;
            document.getElementById('board-title').innerText = gameNameText + " 공략 목록";
            
            renderBoard(); 
        }

        function renderBoard() {
            let listArea = document.getElementById('board-list');
            listArea.innerHTML = ''; 
            
            let currentPosts = posts[currentGame];
            for(let i = 0; i < currentPosts.length; i++) {
                let li = document.createElement('li');
                li.innerText = currentPosts[i].title;
                li.onclick = function() { showPost(i); };
                listArea.appendChild(li);
            }
        }

        function showPost(index) {
            document.getElementById('post-view').style.display = 'block';
            document.getElementById('write-form').style.display = 'none';

            let post = posts[currentGame][index];
            document.getElementById('post-title').innerText = post.title;
            // alt 텍스트를 제목으로 설정하여 이미지가 깨질 때 설명이 나오도록 처리
            document.getElementById('post-media').innerHTML = `<img src="${post.media}" alt="${post.title} 이미지">`;
            document.getElementById('post-content').innerHTML = `<div class="text-box">${post.content}</div>`;
        }

        function showWriteForm() {
            document.getElementById('post-view').style.display = 'none';
            document.getElementById('write-form').style.display = 'block';
        }

        function submitPost() {
            let title = document.getElementById('write-title').value;
            let media = document.getElementById('write-media').value || "default.png";
            let text = document.getElementById('write-text').value;

            if(title === "" || text === "") {
                alert("제목과 내용을 입력해주세요.");
                return;
            }

            posts[currentGame].push({
                title: title,
                media: media,
                content: `<p>${text}</p>`
            });

            alert("게시글이 등록되었습니다!");
            
            document.getElementById('write-title').value = '';
            document.getElementById('write-media').value = '';
            document.getElementById('write-text').value = '';

            renderBoard(); 
            showPost(posts[currentGame].length - 1); 
        }

        // 초기 화면에 '정글 동선 짜는 법' 미리 띄워놓기 (첨부 사진과 동일한 상태)
        renderBoard();
        showPost(1); 
    </script>
</body>
</html>
